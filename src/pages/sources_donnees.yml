# Métadonnées d'affichage pour la page "Sources & millésimes".
#
# Ce fichier ne définit PAS la liste des sources suivies — cette liste vient
# des colonnes millesime_* réellement présentes dans mart_meta_sources.parquet
# (donc de dbt_project.yml, seule source de vérité). Ici, on ajoute juste un
# nom lisible / une source / un dernier contrôle pour chaque colonne connue.
# Une colonne millesime_* sans entrée ici s'affiche quand même (nom brut).
#
# À mettre à jour à la main à chaque vérification — voir docs/ChangementMillesime.md.

